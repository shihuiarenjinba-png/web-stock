name: Refresh DemandScope e-Stat samples

on:
  workflow_dispatch:
  schedule:
    - cron: "27 3 15 * *"

permissions:
  contents: write

concurrency:
  group: refresh-demandscope-estat-samples
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ESTAT_APP_ID: ${{ secrets.ESTAT_APP_ID }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Require e-Stat secret
        shell: bash
        run: |
          test -n "$ESTAT_APP_ID" || (echo "::error::ESTAT_APP_ID repository secret is missing." && exit 1)

      - run: pip install "pandas>=2.2,<3"
      - run: python scripts/update_estat_economic_samples.py

      - name: Secret leak guard
        shell: bash
        run: |
          if grep -R --fixed-strings "$ESTAT_APP_ID" public/samples/economic config docs 2>/dev/null; then
            echo "::error::Secret value found in public output."
            exit 1
          fi

      - name: Commit curated samples only
        shell: bash
        run: |
          git add public/samples/economic/
          if git diff --cached --quiet; then
            echo "No sample-data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh DemandScope e-Stat economic samples"
          git push
