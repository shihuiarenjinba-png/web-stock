name: DemandScope checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Test and syntax check
        run: npm run build
      - name: Verify no secrets are committed and Pages layout is intact
        run: |
          test -f public/index.html
          test -f public/pro/index.html
          test -f public/assets/jszip.min.js
          test -f functions/api/checkout.js
          test -f functions/api/activate.js
          test -f public/_headers
          ! grep -R -E 'sk_(live|test)_[A-Za-z0-9]{15,}' --include='*.js' --include='*.html' public/ functions/ server/
